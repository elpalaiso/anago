[package]
name = "anago"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "anago"
path = "src/main.rs"

[dependencies]
anago-core = { path = "../anago-core" }
# flock(2) for serializing concurrent joins — std has no file lock
# (DESIGN.md §10, §13).
libc = "0.2"

# Control-plane server (DESIGN.md §10). Features are trimmed where we
# control them — no compression, no tracing, no multipart. HTTP/2 is not
# one of those places: axum-server enables hyper/http2 and hyper-util's
# server-auto, so h2 is compiled in whatever axum's own flags say.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# The device side verifies the hub against the machine's own trust
# store, so a privately-issued certificate works once it is installed.
rustls-native-certs = "0.8"
# SHA-256 for device-token hashes (DESIGN.md §7.1).
sha2 = "0.10"
# Third-party JSON only — Cloudflare's and ACME's schemas, never
# anago's own (DESIGN.md §10.1, §10.2). The mini JSON in anago-core is
# deliberately strict, which is right for a schema we define and wrong
# for one we do not.
serde_json = "1"

# ACME (DESIGN.md §10.2). `default-features = false` is a requirement,
# not a preference: the defaults select aws-lc-rs, which would put a
# second crypto backend and a C toolchain requirement under a binary
# that pins ring above. `rcgen` makes the certificate key and CSR;
# `hyper-rustls` is the library's own HTTP stack (hyper is already here
# for the server). `x509-parser` and `time` stay off — they are the ARI
# path, and it is not taken in M1.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "rcgen", "hyper-rustls"] }

[dev-dependencies]
# Drives the router in tests without binding a port.
tower = { version = "0.5", default-features = false, features = ["util"] }
# tokio/axum/rustls/serde는 M0 서버 구현이 요구할 때 추가한다 (원칙 4).
