# Every push/PR: build + full test suite (unit + real-git integration).
# The tests need git but no tmux server (tmux paths degrade gracefully).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # M1.5: the hub is first-class on Linux, Windows and macOS — every
    # platform builds and runs the full suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
